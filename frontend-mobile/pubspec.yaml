name: kora_mobile
description: "Plateforme de centralisation et de transmission des ressources académiques"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Design
  cupertino_icons: ^1.0.5
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Network
  dio: ^5.4.0
  retrofit: ^4.0.3
  pretty_dio_logger: ^1.3.1
  
  # Local Storage (Offline-first)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  
  # Dependency Injection
  get_it: ^7.6.4
  injectable: ^2.3.2
  
  # Utils
  intl: ^0.19.0
  path_provider: ^2.1.1
  permission_handler: ^11.1.0
  image_picker: ^1.0.5
  file_picker: ^10.3.10  # Gardez seulement cette ligne
  cached_network_image: ^3.3.0
  
  # Authentication
  flutter_secure_storage: ^9.0.0

  # Navigation
  go_router: ^12.1.3

  

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Linting & Code Quality
  flutter_lints: ^3.0.1
  very_good_analysis: ^5.1.0
  
  # Code Generation
  build_runner: ^2.4.7
  retrofit_generator: ^8.0.4
  hive_generator: ^2.0.1
  injectable_generator: ^2.4.1
  json_serializable: ^6.7.1
  
  # Testing
  bloc_test: ^9.1.5
  mocktail: ^1.0.1


  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.13.1

#Configuration de l'app icon
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png


#Configuration du splash
flutter_native_splash:
  color: "#C58B2B"
  image: assets/icons/app_icon.png
  
  #Configuration Android
  android: true
  android_12:
    image: assets/icons/app_icon.png
    color: "#C58B2B"
    icon_background_color: "FFFFFF"

  #Configuration ios
  ios: true


flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/