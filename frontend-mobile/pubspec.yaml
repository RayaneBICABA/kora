name: kora_mobile
description: "Plateforme de centralisation et de transmission des ressources académiques"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  cached_network_image: ^3.3.0
  cupertino_icons: ^1.0.5
  dio: ^5.4.0
  equatable: ^2.0.5
  file_picker: ^10.3.10  # Gardez seulement cette ligne
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  flutter_secure_storage: ^9.0.0
  flutter_svg: ^2.0.9
  get_it: ^7.6.4
  go_router: ^12.1.3
  google_fonts: ^6.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.0.5
  injectable: ^2.3.2
  intl: ^0.19.0
  path_provider: ^2.1.1
  permission_handler: ^11.1.0
  pretty_dio_logger: ^1.3.1
  retrofit: ^4.0.3
  shared_preferences: ^2.2.2

dev_dependencies:
  bloc_test: ^9.1.5
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.1
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  injectable_generator: ^2.4.1
  json_serializable: ^6.7.1
  mocktail: ^1.0.1
  retrofit_generator: ^8.0.4
  very_good_analysis: ^5.1.0

#Configuration de l'app icon
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png


#Configuration du splash
flutter_native_splash:
  color: "#C58B2B"
  image: assets/icons/splash_logo_badge.png
  
  #Configuration Android
  android: true
  android_12:
    image: assets/icons/splash_logo_badge.png
    color: "#C58B2B"
    icon_background_color: "#FFFFFF"

  #Configuration ios
  ios: true


flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/
